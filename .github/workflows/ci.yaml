name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: GolangCI Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Test
        run: go test -v -count=1 -timeout 30s ./...

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run benchmarks
        run: |
          echo $'# Benchmarks\n| Benchmark | Iterations | Time/op | Bytes/op | Allocs/op |\n|---|---|---|---|---|' > bench_summary.md
          go test -bench=. -benchmem -count=1 -timeout 120s ./... 2>&1 | awk '
            /^Benchmark/ {printf "| %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5 >> "bench_summary.md"}
            /^ok[[:space:]]/ {total = $NF; pkg = $2; printf "\n**%s** total: %s\n", pkg, total >> "bench_summary.md"}
          '
          cat bench_summary.md >> $GITHUB_STEP_SUMMARY
