name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: GolangCI Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Test
        run: go test -v -count=1 -timeout 30s ./...

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run benchmarks (full render mean time)
        run: |
          echo $'# Benchmarks\n| Benchmark | Iterations | Mean Time/op | Bytes/op | Allocs/op |\n|---|---|---|---|---|' > bench_summary.md
          go test -bench='BenchmarkMain$' -benchmem -count=10 -timeout 120s ./... 2>&1 | awk '
            /^Benchmark/ {
              lines[NR] = sprintf("| %s | %s | %s | %s | %s |", $1, $2, $3, $4, $5)
            }
            /^ok[[:space:]]/ {total = $NF; pkg = $2}
            END {
              for (i in lines) print lines[i] >> "bench_summary.md"
              printf "\n**%s** total: %s\n", pkg, total >> "bench_summary.md"
            }
          '
          cat bench_summary.md >> $GITHUB_STEP_SUMMARY
