name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: GolangCI Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Test
        run: go test -v -count=1 -timeout 30s ./...

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build
        run: go build -o statusline .

      - name: Install hyperfine
        env:
          HYPERFINE_VERSIION: 1.19.0
        run: |
          curl -sL "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSIION}/hyperfine_${HYPERFINE_VERSIION}_amd64.deb" -o hyperfine.deb
          sudo dpkg -i hyperfine.deb

      - name: Run benchmarks with hyperfine
        run: |
          hyperfine --show-output --warmup 3 --min-runs 10 --input .github/assets/bench-input.json --export-markdown bench.md './statusline'
          cat bench.md >> $GITHUB_STEP_SUMMARY
