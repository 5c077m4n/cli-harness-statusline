version: "3"

tasks:
  test:
    desc: Run all tests with verbose output
    cmd: go test -v -count=1 -timeout 60s ./...

  build:
    desc: Build the binary
    cmds:
      - mkdir -p bin
      - go build -o bin/statusline .

  bump-tag:patch:
    desc: Bump the git tag by a patch version
    cmd: |
      latest=$(git describe --tags --abbrev=0) || exit 1
      new=$(echo "$latest" | awk -F. '{print $1"."$2"."$3+1}')
      git tag "$new"
      git push origin "$new"
      echo "Created and pushed tag $new"
